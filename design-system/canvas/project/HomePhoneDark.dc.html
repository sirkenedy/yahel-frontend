<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home on a phone, dark, organisation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#4C9AFF}a:hover{color:#7DB5FF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #050506; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; font-size: 17px; line-height: 22px">

<div style="box-sizing: border-box; padding: 60px 16px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Account: Northwind Studio, organisation" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 6px; border: 0; border-radius: 999px; background: #1A1B1F; font-size: 15px; font-weight: 600; color: #F5F5F7"><span style="width: 32px; height: 32px; border-radius: 9px; background: #4A4B55; color: #FFFFFF; font-size: 13px; display: flex; align-items: center; justify-content: center">N</span>Northwind Studio<svg aria-hidden="true" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="#8E909B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 4 4 4-4"/></svg></button>
<button type="button" aria-label="Notifications" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #1A1B1F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5F5F7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.500 2 6.500H4S6 14 6 9zM10 19a2 2 0 0 0 4 0"/></svg></button>
</div>

<h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.022em">Today</h1>

<div style="box-sizing: border-box; padding: 18px 12px; border-radius: 20px; background: #1A1B1F; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 8px">
<sc-for list="{{apps}}" as="app" hint-placeholder-count="8">
<a href="#app" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #F5F5F7; text-decoration: none">
<span style="width: 56px; height: 56px; border-radius: 14px; background: {{app.color}}; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22)"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{app.d}}"/></svg></span>
<span style="font-size: 12px; line-height: 16px; font-weight: 500">{{app.name}}</span>
</a>
</sc-for>
</div>

<div style="box-sizing: border-box; padding: 16px; border-radius: 20px; background: #1A1B1F; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 13px; line-height: 18px; font-weight: 600; color: #FF6B61">Up next</div>
<div style="font-size: 13px; line-height: 18px; color: #B4B5BF">14:00 to 14:45</div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch">
<div style="width: 4px; border-radius: 999px; background: #FF5A4F; flex-shrink: 0"></div>
<div style="flex: 1 1 0; min-width: 0">
<div style="font-weight: 600">Design review</div>
<div style="font-size: 15px; line-height: 20px; color: #B4B5BF">Lena, Tunde and 3 others</div>
</div>
<button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #1668E3; color: #FFFFFF; font-size: 15px; font-weight: 600; align-self: center">Join</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: -0.012em; padding: 4px 4px 0">Recent</div>
<div style="border-radius: 20px; background: #1A1B1F; padding: 0 16px; display: flex; flex-direction: column">
<a href="#file" style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid rgba(255,255,255,0.12); color: #F5F5F7; text-decoration: none">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #5335CF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 12h6M9 16h6"/></svg></span>
<span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column"><span>Q4 planning notes</span><span style="font-size: 13px; line-height: 18px; color: #B4B5BF">Kofi is editing now</span></span>
<svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#5C5D68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>
</a>
<a href="#file" style="display: flex; align-items: center; gap: 12px; min-height: 64px; color: #F5F5F7; text-decoration: none">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #D040B9; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c4.700 0 8.500 3.200 8.500 7.200s-3.800 7.200-8.500 7.200c-.9 0-1.800-.1-2.600-.3L5 20l.9-3.500C4.400 15.200 3.500 13.300 3.500 11.200 3.500 7.200 7.300 4 12 4z"/></svg></span>
<span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column"><span>Brand team</span><span style="font-size: 13px; line-height: 18px; color: #B4B5BF">Priya: files are in the folder</span></span>
<span style="min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 7px; border-radius: 999px; background: #1668E3; color: #FFFFFF; font-size: 13px; line-height: 22px; font-weight: 600; text-align: center">3</span>
</a>
</div>
</div>

</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center">
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(37,38,43,0.64); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 24px rgba(0,0,0,0.5)">
<a href="#home" aria-current="page" style="width: 80px; height: 52px; border-radius: 999px; background: #0E2747; color: #4C9AFF; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; line-height: 13px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4C9AFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="#mail" style="width: 80px; height: 52px; border-radius: 999px; color: #B4B5BF; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; line-height: 13px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B5BF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zM4 8l8 6 8-6"/></svg>Mail</a>
<a href="#files" style="width: 80px; height: 52px; border-radius: 999px; color: #B4B5BF; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; line-height: 13px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B5BF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.500A2.500 2.500 0 0 1 5.500 5h3.600l2 2.500h7.400A2.500 2.500 0 0 1 21 10v6.500a2.500 2.500 0 0 1-2.500 2.500h-13A2.500 2.500 0 0 1 3 16.500z"/></svg>Files</a>
<a href="#search" style="width: 80px; height: 52px; border-radius: 999px; color: #B4B5BF; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; line-height: 13px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4B5BF" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/></svg>Search</a>
</div>
</nav>

</div>
</x-dc>

</body>
</html>
