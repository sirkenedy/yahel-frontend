name: Agent plan

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  plan:
    if: vars.AGENTS_ENABLED == 'true' && github.event.label.name == 'spec:approved'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          prompt: |
            Read .claude/agents/planner.md and act as that agent, following it exactly.
            Plan spec issue #${{ github.event.issue.number }} in ${{ github.repository }}.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"
      # The redaction step is given only credentials the agent's own shell already held, so it adds
      # no exposure. It runs the script from main with a fixed PATH; if main has no script, nothing
      # is saved.
      - name: Redact the agent transcript
        if: always()
        env:
          REDACT_AGENT_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          REDACT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          rm -f "$RUNNER_TEMP/agent-transcript.json"
          if git show origin/main:scripts/agent/redact-transcript.mjs > "$RUNNER_TEMP/redact-transcript.mjs" 2>/dev/null; then
            node "$RUNNER_TEMP/redact-transcript.mjs" "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/agent-transcript.json" || rm -f "$RUNNER_TEMP/agent-transcript.json"
          else
            echo "::notice::No redaction script on main; transcript not saved."
          fi
      - name: Save the redacted transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-transcript-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-transcript.json
          if-no-files-found: ignore
          retention-days: 7
