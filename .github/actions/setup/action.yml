name: Setup
description: Install pnpm, Node and dependencies
inputs:
  browsers:
    description: Playwright browsers to install (empty for none)
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with: { node-version-file: .nvmrc, cache: pnpm }
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.browsers != ''
      run: pnpm exec playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
